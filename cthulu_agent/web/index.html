<div class="shell" id="shell">
  <aside class="rail" aria-label="Main">
    <a class="brand" href="#overview" aria-label="Cthulu home"><span class="brand-eye" aria-hidden="true"><svg width="26" height="26"><use href="#i-overview"/></svg></span><span class="brand-name">Cthulu</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-back" id="modal" hidden></div>
